image: node:24-alpine
stages: [test, deploy]
checks:
  stage: test
  script:
    - npm test
    - npm run build
pages:
  stage: deploy
  script:
    - npm run build
  pages:
    publish: dist
  artifacts:
    paths: [dist]
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
